services:
  postgres:
    image: postgres:15-alpine
    container_name: lakefs-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: lakefs-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "9001:9001"
      - "9000:9000"
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  lakefs:
    image: treeverse/lakefs:latest
    container_name: lakefs-server
    volumes:
      - ./lakefs.yaml:/etc/lakefs/config.yaml
    environment:
      LAKEFS_AUTH_API_AUTH_CREDENTIALS: "admin:lakefs_admin_password"
      LAKEFS_BLOCKSTORE_S3_ACCESS_KEY_ID: "minio_admin"
      LAKEFS_BLOCKSTORE_S3_SECRET_ACCESS_KEY: "minio_admin_password"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: run

volumes:
  postgres_data:
  minio_data:
